<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinShare - Live Mahila Chat</title>
    
    <!-- Adsterra Popunder Ad Code -->
    <script src="https://pl31093023.profitableratecpmnetwork.com/88/9e/76/889e76661e2ed3d7a72957aa5c956b52.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            color: #333;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .status-bar {
            background: #25d366;
            color: white;
            padding: 10px 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        .profile-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            background: #fafafa;
            transition: transform 0.2s;
        }

        .profile-card:hover {
            transform: translateY(-2px);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e0e0e0;
            margin: 0 auto 8px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 3px solid #ff4757;
        }

        .profile-name {
            font-weight: 600;
            font-size: 15px;
        }

        .profile-age {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .btn-connect {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CoinShare Live Chat</h1>
        <p>Connect with active members nearby</p>
    </div>

    <div class="chat-container">
        <div class="status-bar">
            <span class="online-dot"></span> 142 Members Online Right Now
        </div>

        <div class="profiles-grid">
            <div class="profile-card">
                <div class="avatar">👩‍💼</div>
                <div class="profile-name">Priya S.</div>
                <div class="profile-age">24 yrs • Delhi</div>
                <button class="btn-connect" onclick="triggerAd()">Start Chat</button>
            </div>

            <div class="profile-card">
                <div class="avatar">👩‍🔬</div>
                <div class="profile-name">Ananya M.</div>
                <div class="profile-age">22 yrs • Mumbai</div>
                <button class="btn-connect" onclick="triggerAd()">Start Chat</button>
            </div>

            <div class="profile-card">
                <div class="avatar">👩‍🎨</div>
                <div class="profile-name">Riya Sharma</div>
                <div class="profile-age">25 yrs • Bangalore</div>
                <button class="btn-connect" onclick="triggerAd()">Start Chat</button>
            </div>

            <div class="profile-card">
                <div class="avatar">👩‍💻</div>
                <div class="profile-name">Neha Gupta</div>
                <div class="profile-age">23 yrs • Pune</div>
                <button class="btn-connect" onclick="triggerAd()">Start Chat</button>
            </div>
        </div>
    </div>

    <div class="footer-note">
        © 2026 CoinShare. All rights reserved.
    </div>

    <script>
        function triggerAd() {
            alert("Connecting to live chat room... Please wait.");
        }
    </script>
</body>
</html>
