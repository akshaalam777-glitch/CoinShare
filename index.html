<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinShare - Professional File Storage</title>

    <script src="https://pl31093023.profitableratecpmnetwork.com/88/9e/76/889e76661e2ed3d7a72957aa5c956b52.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="header">
                <h1><span class="logo-coin">Coin</span><span class="logo-share">Share</span></h1>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Mode</button>
        </div>

        <div id="auth-box" class="auth-box">
            <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 4px;">Enter your email & password</p>
            
            <input type="email" id="auth-email" placeholder="Email address">
            <input type="password" id="auth-password" placeholder="Password">
            
            <button class="btn" onclick="handleSignIn()">Sign In</button>
            <button class="btn btn-outline" onclick="handleSignUp()">Create Account (Sign Up)</button>
            
            <p id="auth-status" class="status-msg" style="margin-top: 5px;"></p>
        </div>

        <div id="dashboard-box" class="dashboard-box hidden">
            <p style="font-size: 12px; color: var(--text-secondary);">User: <strong id="user-email" style="color: var(--text-primary);"></strong></p>
            
            <hr>

            <p style="font-size: 13px; font-weight: 600;">Upload File</p>
            <input type="file" id="file-input">
            <button class="btn" onclick="uploadFile()">Upload to Cloud</button>
            <p id="upload-status" class="status-msg"></p>

            <hr>

            <p style="font-size: 13px; font-weight: 600;">Your Files</p>
            <div id="file-list">
                <p style="font-size: 12px; color: var(--text-secondary);">Loading files...</p>
            </div>

            <button class="btn btn-logout" onclick="signOut()">Log Out</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item">🏠</a>
        <a href="#" class="nav-item">➕</a>
        <a href="#" class="nav-item">5</a>
        <a href="#" class="nav-item">☰</a>
    </nav>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://vwkdluymwcxujgvfiklc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3a2RsdXltd2N4dWpndmZpa2xjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDU1NTIsImV4cCI6MjEwMzU4MTU1Mn0.NuiH2apGr7sNVJR0JjR2eZAN0gGtUfPeHdTOicOdkJ8";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleTheme() {
            const htmlTag = document.documentElement;
            const currentTheme = htmlTag.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlTag.setAttribute('data-theme', 'light');
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
            }
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showDashboard(session.user);
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('dashboard-box').classList.add('hidden');
        }

        function showDashboard(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('dashboard-box').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            listFiles();
        }

        // Email Sign Up
        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            if (!email || !password) {
                status.innerText = "Please enter email and password.";
                return;
            }

            status.innerText = "Creating account...";
            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "Account created successfully! You can now sign in.";
            }
        }

        // Email Sign In
        async function handleSignIn() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            if (!email || !password) {
                status.innerText = "Please enter email and password.";
                return;
            }

            status.innerText = "Signing in...";
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                checkSession();
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            showAuth();
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const status = document.getElementById('upload-status');
            if (!fileInput.files.length) {
                alert("Please select a file.");
                return;
            }

            const file = fileInput.files[0];
            const filePath = `public/${Date.now()}_${file.name}`;

            status.innerText = "Uploading...";
            const { data, error } = await supabase.storage.from('files').upload(filePath, file);

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "File uploaded successfully.";
                fileInput.value = "";
                listFiles();
            }
        }

        async function listFiles() {
            const fileListDiv = document.getElementById('file-list');
            const { data, error } = await supabase.storage.from('files').list('public', {
                limit: 20,
                offset: 0
            });

            if (error || !data || data.length === 0) {
                fileListDiv.innerHTML = "<p style='font-size:12px; color:var(--text-secondary);'>No files found.</p>";
                return;
            }

            fileListDiv.innerHTML = "";
            data.forEach(item => {
                const { data: publicUrlData } = supabase.storage.from('files').getPublicUrl(`public/${item.name}`);
                const cleanName = item.name.split('_').slice(1).join('_');
                
                const fileCard = document.createElement('div');
                fileCard.className = 'file-card';
                fileCard.innerHTML = `
                    <span class="file-name">${cleanName}</span>
                    <div class="file-actions">
                        <button class="action-btn" onclick="navigator.clipboard.writeText('${publicUrlData.publicUrl}'); alert('Link Copied!');">Copy</button>
                        <a href="${publicUrlData.publicUrl}" target="_blank" class="action-btn">Download</a>
                    </div>
                `;
                fileListDiv.appendChild(fileCard);
            });
        }

        checkSession();
    </script>
</body>
</html>
