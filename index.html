<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinShare Cloud - Professional File Storage</title>

    <!-- Adsterra Popunder Ad Code -->
    <script src="https://pl31093023.profitableratecpmnetwork.com/88/9e/76/889e76661e2ed3d7a72957aa5c956b52.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Pure Black & White / Minimalist Theme Variables */
        :root[data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
        }

        :root[data-theme="light"] {
            --bg-color: #ffffff;
            --card-bg: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --btn-hover: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Black and White Theme Switch Button */
        .theme-toggle-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .theme-toggle-btn:hover {
            border-color: var(--text-primary);
        }

        .auth-box, .dashboard-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hidden {
            display: none !important;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-logout {
            background: transparent;
            color: #ff4d4f;
            border: 1px solid #ff4d4f;
            margin-top: 10px;
        }

        .btn-logout:hover {
            background: #ff4d4f10;
        }

        .file-card {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
            max-width: 220px;
            color: var(--text-primary);
        }

        .file-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 6px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 14px 0;
        }

        /* Bottom Navigation Bar */
        nav.bottom-nav {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
        }

        .nav-item {
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="header">
                <h1>CoinShare Cloud</h1>
            </div>
            <!-- B&W Theme Toggle Button -->
            <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle B&W Mode</button>
        </div>

        <!-- SOCIAL AUTH SECTION -->
        <div id="auth-box" class="auth-box">
            <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 8px;">Sign in or create account to manage files.</p>
            
            <button class="btn btn-outline" onclick="socialLogin('google')">
                <span>🌐</span> Continue with Google
            </button>
            <button class="btn btn-outline" onclick="socialLogin('github')">
                <span>🐙</span> Continue with GitHub
            </button>
            <button class="btn btn-outline" onclick="socialLogin('facebook')">
                <span>📘</span> Continue with Facebook
            </button>
            
            <p id="auth-status" class="status-msg" style="margin-top: 10px;"></p>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-box" class="dashboard-box hidden">
            <p style="font-size: 12px; color: var(--text-secondary);">User: <strong id="user-email" style="color: var(--text-primary);"></strong></p>
            
            <hr>

            <p style="font-size: 13px; font-weight: 600;">Upload File</p>
            <input type="file" id="file-input">
            <button class="btn" onclick="uploadFile()">Upload to Cloud</button>
            <p id="upload-status" class="status-msg"></p>

            <hr>

            <p style="font-size: 13px; font-weight: 600;">Your Files</p>
            <div id="file-list">
                <p style="font-size: 12px; color: var(--text-secondary);">Loading files...</p>
            </div>

            <button class="btn btn-logout" onclick="signOut()">Log Out</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">🏠</a>
        <a href="#" class="nav-item">➕</a>
        <a href="#" class="nav-item">5</a>
        <a href="#" class="nav-item">☰</a>
    </nav>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://vwkdluymwcxujgvfiklc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3a2RsdXltd2N4dWpndmZpa2xjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDU1NTIsImV4cCI6MjEwMzU4MTU1Mn0.NuiH2apGr7sNVJR0JjR2eZAN0gGtUfPeHdTOicOdkJ8";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Clean Black & White Theme Toggle Logic
        function toggleTheme() {
            const htmlTag = document.documentElement;
            const currentTheme = htmlTag.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlTag.setAttribute('data-theme', 'light');
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
            }
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showDashboard(session.user);
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('dashboard-box').classList.add('hidden');
        }

        function showDashboard(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('dashboard-box').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email || user.user_metadata.full_name || "User";
            listFiles();
        }

        // Social Login Handler via Supabase OAuth
        async function socialLogin(provider) {
            const status = document.getElementById('auth-status');
            status.innerText = `Connecting to ${provider}...`;
            
            const { error } = await supabase.auth.signInWithOAuth({
                provider: provider,
                options: {
                    redirectTo: window.location.href
                }
            });

            if (error) {
                status.innerText = "Error: " + error.message;
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            showAuth();
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const status = document.getElementById('upload-status');
            if (!fileInput.files.length) {
                alert("Please select a file.");
                return;
            }

            const file = fileInput.files[0];
            const filePath = `public/${Date.now()}_${file.name}`;

            status.innerText = "Uploading...";
            const { data, error } = await supabase.storage.from('files').upload(filePath, file);

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "File uploaded successfully.";
                fileInput.value = "";
                listFiles();
            }
        }

        async function listFiles() {
            const fileListDiv = document.getElementById('file-list');
            const { data, error } = await supabase.storage.from('files').list('public', {
                limit: 20,
                offset: 0
            });

            if (error || !data || data.length === 0) {
                fileListDiv.innerHTML = "<p style='font-size:12px; color:var(--text-secondary);'>No files found.</p>";
                return;
            }

            fileListDiv.innerHTML = "";
            data.forEach(item => {
                const { data: publicUrlData } = supabase.storage.from('files').getPublicUrl(`public/${item.name}`);
                const cleanName = item.name.split('_').slice(1).join('_');
                
                const fileCard = document.createElement('div');
                fileCard.className = 'file-card';
                fileCard.innerHTML = `
                    <span class="file-name">${cleanName}</span>
                    <div class="file-actions">
                        <button class="action-btn" onclick="navigator.clipboard.writeText('${publicUrlData.publicUrl}'); alert('Link Copied!');">Copy</button>
                        <a href="${publicUrlData.publicUrl}" target="_blank" class="action-btn">Download</a>
                    </div>
                `;
                fileListDiv.appendChild(fileCard);
            });
        }

        checkSession();
    </script>
</body>
            </html>
